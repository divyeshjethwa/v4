# Nginx site config for the portfolio (static Expo export).
# Copy to /etc/nginx/sites-available/portfolio, set server_name and root, then:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com      # HTTPS via Let's Encrypt

server {
    listen 80;
    server_name your-domain.com;          # TODO: your domain
    root /var/www/portfolio;              # TODO: where you upload dist/

    # Compress text files (JS, CSS, HTML, fonts that aren't already compressed).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               font/ttf application/x-font-ttf application/vnd.ms-fontobject;

    # Expo puts a content hash in every JS, font and image filename, so they can be cached for a year.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML: always revalidate, so a new deploy shows up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
